<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Heroku Enterprise Usage Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #430098;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.9375rem;
      color: #64748b;
      font-weight: 500;
    }

    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(67, 0, 152, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
      padding: 40px;
      border: 1px solid #e2e8f0;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .password-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.9375rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
      background: #f8fafc;
    }

    .form-input.with-icon {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: #64748b;
      font-size: 1.125rem;
      line-height: 1;
      transition: color 0.2s ease;
      user-select: none;
    }

    .password-toggle:hover {
      color: #430098;
    }

    .password-toggle:focus {
      outline: 2px solid #6762a6;
      outline-offset: 2px;
      border-radius: 4px;
    }

    .form-input:focus {
      outline: none;
      border-color: #6762a6;
      background: white;
      box-shadow: 0 0 0 3px rgba(103, 98, 166, 0.1);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .btn-login {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #430098 0%, #6762a6 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(103, 98, 166, 0.2);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(103, 98, 166, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 20px;
      border-left: 3px solid #ef4444;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .info-message {
      background: #dbeafe;
      color: #1e40af;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 20px;
      border-left: 3px solid #3b82f6;
      display: none;
    }

    .info-message.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
    }

    .login-footer-text {
      font-size: 0.8125rem;
      color: #64748b;
      line-height: 1.6;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #166534;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 12px;
      border: 1px solid #86efac;
    }

    .privacy-notice {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 3px solid #6762a6;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #475569;
      margin-bottom: 20px;
      line-height: 1.6;
      text-align: left;
    }

    .privacy-notice-icon {
      display: inline-block;
      margin-right: 6px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }

      .login-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title">Heroku Usage Tracker</h1>
      <p class="login-subtitle">Enterprise Monitoring Platform</p>
    </div>

    <div class="login-card">
      <div id="infoMessage" class="info-message"></div>
      <div id="errorMessage" class="error-message"></div>

      <div class="privacy-notice">
        <span class="privacy-notice-icon">🔒</span>
        Login attempts are logged for security monitoring.
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input with-icon"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          Sign In
        </button>
      </form>

      <div class="login-footer">
        <p class="login-footer-text">
          Enterprise Usage Analytics & License Monitoring
        </p>
        <span class="login-badge">
          🔒 Secure Authentication
        </span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const infoMessage = document.getElementById('infoMessage');
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');

    // Check for session expiry message in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === 'true') {
      infoMessage.textContent = 'Your session has expired. Please log in again.';
      infoMessage.classList.add('show');
    }

    // Password visibility toggle
    let passwordVisible = false;
    togglePasswordBtn.addEventListener('click', () => {
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      togglePasswordBtn.textContent = passwordVisible ? '🙈' : '👁️';
      togglePasswordBtn.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous messages
      errorMessage.classList.remove('show');
      errorMessage.textContent = '';
      infoMessage.classList.remove('show');
      infoMessage.textContent = '';

      // Disable button during request
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: usernameInput.value,
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Redirect to dashboard
          window.location.href = '/';
        } else {
          // Show error
          errorMessage.textContent = data.error || 'Invalid username or password';
          errorMessage.classList.add('show');

          // Clear password field
          passwordInput.value = '';
          passwordInput.focus();

          // Re-enable button
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      } catch (error) {
        errorMessage.textContent = 'An error occurred. Please try again.';
        errorMessage.classList.add('show');

        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });

    // Focus username field on load
    usernameInput.focus();
  </script>
</body>
</html>
